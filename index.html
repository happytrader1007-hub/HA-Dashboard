<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HA Signal Monitor</title>

<!-- Apple主屏幕图标 (加到主屏幕时显示的icon) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HA Signal">
<meta name="theme-color" content="#0a0a0e">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0e;
    --panel: #14141b;
    --panel-2: #1b1b24;
    --border: #26262f;
    --text: #e9e9ee;
    --text-dim: #8a8a99;
    --text-faint: #55555f;
    --green: #22c55e;
    --green-dim: #16341f;
    --red: #f0475a;
    --red-dim: #3a1620;
    --accent: #7c7ff2;
    --accent-2: #4fd1c5;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse 1200px 600px at 50% -10%, #171722 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
  }
  .num, .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 104px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 12px;
    gap: 22px;
    border-right: 1px solid var(--border);
    min-height: 100vh;
  }
  .sidebar .logo {
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; flex-shrink: 0; margin-bottom: 6px;
  }
  .nav-btn {
    width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: transparent; border: none; color: var(--text-dim);
    font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600;
    padding: 10px 4px; border-radius: 11px; cursor: pointer; transition: all .15s;
  }
  .nav-btn svg { width: 20px; height: 20px; }
  .nav-btn:hover { color: var(--text); background: var(--panel); }
  .nav-btn.active { color: var(--accent-2); background: var(--panel); }

  .main-content {
    flex: 1;
    min-width: 0;
    padding: 32px 24px 80px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  /* ---- Header ---- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .header-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .refresh-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text-dim); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--accent); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .symbol-select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    padding: 8px 12px; border-radius: 9px; margin-bottom: 18px; cursor: pointer;
  }

  /* ---- Status card ---- */
  .status-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    margin-bottom: 16px;
  }
  .status-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-dim); margin-bottom: 18px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .dot.live { background: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }

  .open-positions { display: flex; flex-direction: column; gap: 10px; }
  .open-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .open-row-left { display: flex; align-items: center; gap: 10px; }
  .dir-badge {
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  }
  .dir-badge.long { background: var(--green-dim); color: var(--green); }
  .dir-badge.short { background: var(--red-dim); color: var(--red); }
  .open-sym { font-weight: 600; font-size: 14px; }
  .open-price { font-size: 12.5px; color: var(--text-dim); }

  .empty-state { text-align: center; padding: 24px 0 8px; }
  .empty-state .big { font-size: 15px; color: var(--text-dim); margin-bottom: 6px; }
  .empty-state .small { font-size: 12.5px; color: var(--text-faint); }

  /* ---- Stat cards ---- */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 10px; text-align: center;
  }
  .stat-value { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 5px; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }

  /* ---- Trade list ---- */
  .section-title {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; font-weight: 700; margin: 20px 0 10px;
  }
  .section-title .count { font-size: 12px; color: var(--text-dim); font-weight: 400; }

  .trade-row {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
  }
  .trade-icon {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .trade-icon.win { background: var(--green-dim); color: var(--green); }
  .trade-icon.loss { background: var(--red-dim); color: var(--red); }
  .trade-body { flex: 1; min-width: 0; }
  .trade-top { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px; }
  .trade-sym { font-weight: 700; }
  .trade-date { color: var(--text-faint); font-size: 11.5px; }
  .trade-prices { font-size: 12.5px; color: var(--text-dim); }
  .trade-prices .arrow { color: var(--text-faint); margin: 0 4px; }
  .trade-sub { font-size: 11px; color: var(--text-faint); margin-top: 3px; }
  .trade-sub .sl { color: var(--red); }
  .trade-sub .tp { color: var(--green); }
  .trade-right { text-align: right; flex-shrink: 0; }
  .reason-badge {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    padding: 2px 8px; border-radius: 6px; margin-bottom: 4px;
  }
  .reason-badge.tp { background: var(--green-dim); color: var(--green); }
  .reason-badge.sl { background: var(--red-dim); color: var(--red); }
  .reason-badge.timeout { background: #2a2a35; color: var(--text-dim); }
  .r-value { font-weight: 700; font-size: 14px; }
  .r-value.pos { color: var(--green); }
  .r-value.neg { color: var(--red); }

  /* ---- Calendar ---- */
  .cal-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .cal-title { font-size: 17px; font-weight: 700; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    cursor: pointer; font-size: 14px;
  }
  .cal-nav button:hover { color: var(--text); }

  .cal-summary { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 18px; }
  .cal-summary .stat-card { padding: 14px 8px; }
  .cal-summary .stat-value { font-size: 18px; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--text-faint); padding-bottom: 4px; }
  .cal-cell {
    aspect-ratio: 1; border-radius: 9px; padding: 6px 8px;
    background: var(--panel); border: 1px solid var(--border);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .cal-cell.empty { background: transparent; border: none; }
  .cal-cell .daynum { font-size: 10.5px; color: var(--text-faint); }
  .cal-cell .dayr { font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .cal-cell.win { background: rgba(34,197,94,0.10); border-color: rgba(34,197,94,0.35); }
  .cal-cell.win .dayr { color: var(--green); }
  .cal-cell.loss { background: rgba(240,71,90,0.10); border-color: rgba(240,71,90,0.35); }
  .cal-cell.loss .dayr { color: var(--red); }
  .cal-cell.has-trades { cursor: pointer; transition: all .12s; }
  .cal-cell.has-trades:hover { transform: translateY(-1px); border-color: var(--accent); }
  .cal-cell.selected { border-color: var(--accent-2) !important; box-shadow: 0 0 0 1px var(--accent-2); }

  .day-detail { margin-top: 20px; }
  .day-detail-header {
    font-size: 13.5px; font-weight: 700; color: var(--text);
    margin-bottom: 10px;
  }
  .day-detail-header .sep { color: var(--text-faint); font-weight: 400; margin: 0 6px; }
  .day-detail-empty { font-size: 12.5px; color: var(--text-faint); padding: 4px 0 0; }

  .footer-note {
    text-align: center; font-size: 11.5px; color: var(--text-faint);
    margin-top: 28px; line-height: 1.6;
  }

  @media (max-width: 640px) {
    body { flex-direction: column; }
    .sidebar {
      width: 100%; min-height: auto; flex-direction: row;
      border-right: none; border-bottom: 1px solid var(--border);
      padding: 14px 16px; gap: 10px; align-items: center;
    }
    .sidebar .logo { margin-bottom: 0; }
    .nav-btn { width: auto; flex-direction: row; padding: 8px 12px; }
    .main-content { padding: 20px 16px 60px; }
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .cal-summary { grid-template-columns: repeat(2, 1fr); }
    .trade-prices { font-size: 11.5px; }
  }
</style>
</head>
<body>
<nav class="sidebar">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <line x1="30" y1="26" x2="30" y2="70" stroke="#fca5b1" stroke-width="4" stroke-linecap="round"/>
      <rect x="23" y="38" width="14" height="20" rx="3" fill="#3a1620" stroke="#f0475a" stroke-width="3"/>
      <line x1="50" y1="20" x2="50" y2="62" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round"/>
      <rect x="43" y="34" width="14" height="22" rx="3" fill="#16341f" stroke="#22c55e" stroke-width="3"/>
      <line x1="70" y1="12" x2="70" y2="52" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round"/>
      <rect x="63" y="20" width="14" height="26" rx="3" fill="#16341f" stroke="#22c55e" stroke-width="3"/>
    </svg>
  </div>
  <button class="nav-btn active" data-page="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/>
    </svg>
    首页
  </button>
  <button class="nav-btn" data-page="calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
    </svg>
    日历
  </button>
</nav>

<div class="main-content">
<div class="wrap">

  <div class="header">
    <div class="header-left">
      <div>
        <div class="header-title">HA Signal Monitor</div>
        <div class="header-sub" id="updatedText">加载中…</div>
      </div>
    </div>
    <button class="refresh-btn" id="refreshBtn" title="刷新">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
    </button>
  </div>

  <select class="symbol-select" id="symbolSelect"></select>

  <div id="homePage">
    <div class="status-card">
      <div class="status-label">
        <span class="dot" id="statusDot"></span>
        <span id="statusLabel">目前状态</span>
      </div>
      <div id="statusBody"></div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="section-title">
      <span>最近交易</span>
      <span class="count" id="recentCount"></span>
    </div>
    <div id="tradeList"></div>
  </div>

  <div id="calendarPage" style="display:none;">
    <div class="cal-header">
      <div class="cal-title" id="calTitle"></div>
      <div class="cal-nav">
        <button id="calPrev">‹</button>
        <button id="calNext">›</button>
      </div>
    </div>
    <div class="cal-summary" id="calSummary"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="dayDetail"></div>
  </div>

  <div class="footer-note">
    HA趋势 + 摆动点趋势线突破策略 · 数据每小时自动更新<br>
    止损0.8% / 止盈1.2% · 1小时周期
  </div>

</div>
</div>

<script>
let allTrades = [];
let openPositions = {};
let currentSymbol = "ALL";
let calMonth = null; // {year, month} 0-indexed month
let calByDay = {};   // 当前显示月份 每天对应的交易列表
let selectedDay = null; // 目前点选的日期(用于下方显示明细)

const $ = (id) => document.getElementById(id);

async function loadData() {
  const btn = $("refreshBtn");
  btn.classList.add("spinning");
  try {
    const [tradesRes, stateRes] = await Promise.all([
      fetch("trades_log.json?_=" + Date.now()),
      fetch("state.json?_=" + Date.now())
    ]);
    allTrades = tradesRes.ok ? await tradesRes.json() : [];
    const state = stateRes.ok ? await stateRes.json() : {};
    openPositions = {};
    for (const [sym, s] of Object.entries(state)) {
      if (s && s.in_position) openPositions[sym] = s;
    }

    const lastMod = tradesRes.headers.get("Last-Modified");
    updateFreshness(lastMod);

    populateSymbolSelect();
    render();
  } catch (e) {
    $("updatedText").textContent = "数据加载失败";
    console.error(e);
  } finally {
    setTimeout(() => btn.classList.remove("spinning"), 400);
  }
}

function updateFreshness(lastModHeader) {
  let text = "";
  if (lastModHeader) {
    const t = new Date(lastModHeader);
    const mins = Math.round((Date.now() - t.getTime()) / 60000);
    text = (mins <= 1 ? "刚刚更新" : mins < 60 ? `${mins} 分钟前更新` : `${Math.round(mins/60)} 小时前更新`);
  } else {
    text = "已加载";
  }
  const now = new Date();
  const utc = now.toUTCString().slice(17, 25);
  const utc8Date = new Date(now.getTime() + 8 * 3600 * 1000);
  const utc8 = utc8Date.toUTCString().slice(17, 25);
  text += `  ·  UTC ${utc}  ·  UTC+8 ${utc8}`;
  $("updatedText").textContent = text;
}

function populateSymbolSelect() {
  const symbols = Array.from(new Set(allTrades.map(t => t.symbol))).sort();
  const sel = $("symbolSelect");
  const prev = currentSymbol;
  sel.innerHTML = "";
  const optAll = document.createElement("option");
  optAll.value = "ALL"; optAll.textContent = "全部品种";
  sel.appendChild(optAll);
  symbols.forEach(s => {
    const o = document.createElement("option");
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
  currentSymbol = symbols.includes(prev) || prev === "ALL" ? prev : "ALL";
  sel.value = currentSymbol;
}

function filteredTrades() {
  const t = currentSymbol === "ALL" ? allTrades : allTrades.filter(t => t.symbol === currentSymbol);
  return t.slice().sort((a,b) => new Date(a.exit_date) - new Date(b.exit_date));
}

function maxLosingStreak(trades) {
  let max = 0, cur = 0;
  for (const t of trades) {
    if (t.r_multiple <= 0) { cur++; max = Math.max(max, cur); } else { cur = 0; }
  }
  return max;
}

function render() {
  renderStatus();
  renderStats();
  renderTradeList();
  renderCalendar();
}

function renderStatus() {
  const dot = $("statusDot");
  const body = $("statusBody");
  const entries = currentSymbol === "ALL"
    ? Object.entries(openPositions)
    : Object.entries(openPositions).filter(([s]) => s === currentSymbol);

  if (entries.length === 0) {
    dot.className = "dot";
    body.innerHTML = `
      <div class="empty-state">
        <div class="big">没有进行中的信号</div>
        <div class="small">策略正在监控市场，出现信号会立即更新在这里</div>
      </div>`;
    return;
  }

  dot.className = "dot live";
  body.innerHTML = '<div class="open-positions">' + entries.map(([sym, s]) => {
    const dirClass = s.direction === "多" ? "long" : "short";
    return `
      <div class="open-row">
        <div class="open-row-left">
          <span class="dir-badge ${dirClass}">${s.direction}</span>
          <span class="open-sym">${sym}</span>
        </div>
        <div class="open-price mono">进场 ${fmt(s.entry_price)} · 止损 ${fmt(s.stop_price)} · 止盈 ${fmt(s.tp_price)}</div>
      </div>`;
  }).join("") + '</div>';
}

function renderStats() {
  const trades = filteredTrades();
  const n = trades.length;
  const wins = trades.filter(t => t.r_multiple > 0).length;
  const winRate = n ? (wins / n * 100).toFixed(1) + "%" : "—";
  const avgR = n ? (trades.reduce((a,t) => a + t.r_multiple, 0) / n) : 0;
  const openCount = currentSymbol === "ALL"
    ? Object.keys(openPositions).length
    : (openPositions[currentSymbol] ? 1 : 0);
  const streak = maxLosingStreak(trades);

  const stats = [
    { label: "总交易数", value: n, cls: "" },
    { label: "胜率", value: winRate, cls: "" },
    { label: "平均R", value: (n ? (avgR >= 0 ? "+" : "") + avgR.toFixed(2) + "R" : "—"), cls: avgR >= 0 ? "green" : "red" },
    { label: "进行中", value: openCount, cls: openCount > 0 ? "green" : "" },
    { label: "最高连亏", value: streak, cls: streak >= 8 ? "red" : "" },
  ];

  $("statsGrid").innerHTML = stats.map(s => `
    <div class="stat-card">
      <div class="stat-value num ${s.cls}">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>`).join("");
}

function fmt(v) {
  if (v == null) return "—";
  const n = Number(v);
  if (n >= 100) return n.toFixed(2);
  if (n >= 1) return n.toFixed(4);
  return n.toFixed(6);
}

function reasonBadge(reason) {
  if (reason === "止盈") return '<span class="reason-badge tp">止盈</span>';
  if (reason === "止损") return '<span class="reason-badge sl">止损</span>';
  return '<span class="reason-badge timeout">超时平仓</span>';
}

function renderTradeList() {
  const trades = filteredTrades().slice().reverse().slice(0, 30);
  $("recentCount").textContent = `共 ${filteredTrades().length} 笔`;

  if (trades.length === 0) {
    $("tradeList").innerHTML = `<div class="empty-state"><div class="big">暂无历史交易记录</div></div>`;
    return;
  }

  $("tradeList").innerHTML = trades.map(t => {
    const isWin = t.r_multiple > 0;
    const dirArrow = t.direction === "多" ? "↗" : "↘";
    const d = new Date(t.exit_date);
    const dateStr = d.toISOString().slice(0,10) + " " + d.toISOString().slice(11,16);
    return `
      <div class="trade-row">
        <div class="trade-icon ${isWin ? 'win' : 'loss'}">${dirArrow}</div>
        <div class="trade-body">
          <div class="trade-top">
            <span class="trade-sym">${t.symbol}</span>
            <span class="trade-date">${dateStr}</span>
          </div>
          <div class="trade-prices mono">${fmt(t.entry_price)}<span class="arrow">→</span>${fmt(t.exit_price)}</div>
          <div class="trade-sub mono">止损 <span class="sl">${fmt(t.entry_price)}</span> · 止盈 <span class="tp">${fmt(t.exit_price)}</span></div>
        </div>
        <div class="trade-right">
          ${reasonBadge(t.reason)}
          <div class="r-value num ${isWin ? 'pos' : 'neg'}">${isWin ? '+' : ''}${t.r_multiple.toFixed(2)}R</div>
        </div>
      </div>`;
  }).join("");
}

function renderCalendar() {
  const trades = filteredTrades();
  if (!calMonth) {
    if (trades.length) {
      const d = new Date(trades[trades.length-1].exit_date);
      calMonth = { year: d.getUTCFullYear(), month: d.getUTCMonth() };
    } else {
      const now = new Date();
      calMonth = { year: now.getUTCFullYear(), month: now.getUTCMonth() };
    }
  }

  const { year, month } = calMonth;
  $("calTitle").textContent = `${year}年 ${month+1}月`;

  const byDay = {};
  trades.forEach(t => {
    const d = new Date(t.exit_date);
    if (d.getUTCFullYear() === year && d.getUTCMonth() === month) {
      const day = d.getUTCDate();
      byDay[day] = byDay[day] || [];
      byDay[day].push(t);
    }
  });
  calByDay = byDay; // 供点击某一天时查询用

  const monthTrades = Object.values(byDay).flat();
  const monthR = monthTrades.reduce((a,t) => a + t.r_multiple, 0);
  const monthWins = monthTrades.filter(t => t.r_multiple > 0).length;
  const monthWinRate = monthTrades.length ? (monthWins/monthTrades.length*100).toFixed(1)+"%" : "—";
  const monthAvgR = monthTrades.length ? (monthR/monthTrades.length) : 0;

  $("calSummary").innerHTML = `
    <div class="stat-card"><div class="stat-value num ${monthR>=0?'green':'red'}">${monthR>=0?'+':''}${monthR.toFixed(2)}R</div><div class="stat-label">本月总R</div></div>
    <div class="stat-card"><div class="stat-value num">${monthTrades.length}</div><div class="stat-label">交易笔数</div></div>
    <div class="stat-card"><div class="stat-value num">${monthWinRate}</div><div class="stat-label">胜率</div></div>
    <div class="stat-card"><div class="stat-value num ${monthAvgR>=0?'green':'red'}">${monthAvgR>=0?'+':''}${monthAvgR.toFixed(2)}R</div><div class="stat-label">日均R</div></div>
  `;

  const dows = ["一","二","三","四","五","六","日"];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join("");

  const firstDay = new Date(Date.UTC(year, month, 1));
  let startOffset = firstDay.getUTCDay() - 1; // Monday = 0
  if (startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(Date.UTC(year, month+1, 0)).getUTCDate();

  for (let i = 0; i < startOffset; i++) html += `<div class="cal-cell empty"></div>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const dayTrades = byDay[day];
    const isSelected = selectedDay === day;
    if (dayTrades && dayTrades.length) {
      const dayR = dayTrades.reduce((a,t) => a + t.r_multiple, 0);
      const cls = dayR >= 0 ? "win" : "loss";
      html += `<div class="cal-cell ${cls} has-trades${isSelected ? ' selected' : ''}" data-day="${day}"><span class="daynum">${day}</span><span class="dayr num">${dayR>=0?'+':''}${dayR.toFixed(2)}R</span></div>`;
    } else {
      html += `<div class="cal-cell"><span class="daynum">${day}</span></div>`;
    }
  }
  $("calGrid").innerHTML = html;

  $("calGrid").querySelectorAll(".cal-cell.has-trades").forEach(cell => {
    cell.addEventListener("click", () => {
      const day = parseInt(cell.dataset.day, 10);
      selectedDay = (selectedDay === day) ? null : day; // 再点一次取消选中
      renderCalendar();
      renderDayDetail();
    });
  });

  renderDayDetail();
}

function renderDayDetail() {
  const box = $("dayDetail");
  if (!selectedDay || !calByDay[selectedDay]) {
    box.innerHTML = "";
    return;
  }
  const { year, month } = calMonth;
  const dayTrades = calByDay[selectedDay].slice().sort((a,b) => new Date(a.exit_date) - new Date(b.exit_date));
  const dayR = dayTrades.reduce((a,t) => a + t.r_multiple, 0);
  const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}`;

  const rows = dayTrades.map(t => {
    const isWin = t.r_multiple > 0;
    const dirArrow = t.direction === "多" ? "↗" : "↘";
    const d = new Date(t.exit_date);
    const timeStr = d.toISOString().slice(11,16);
    return `
      <div class="trade-row">
        <div class="trade-icon ${isWin ? 'win' : 'loss'}">${dirArrow}</div>
        <div class="trade-body">
          <div class="trade-top">
            <span class="trade-sym">${t.symbol}</span>
            <span class="trade-date">${dateStr} ${timeStr}</span>
          </div>
          <div class="trade-prices mono">${fmt(t.entry_price)}<span class="arrow">→</span>${fmt(t.exit_price)}</div>
        </div>
        <div class="trade-right">
          ${reasonBadge(t.reason)}
          <div class="r-value num ${isWin ? 'pos' : 'neg'}">${isWin ? '+' : ''}${t.r_multiple.toFixed(2)}R</div>
        </div>
      </div>`;
  }).join("");

  box.innerHTML = `
    <div class="day-detail">
      <div class="day-detail-header">${dateStr}<span class="sep">·</span>净 ${dayR>=0?'+':''}${dayR.toFixed(2)}R<span class="sep">·</span>${dayTrades.length} 笔</div>
      ${rows}
    </div>`;
}

$("symbolSelect").addEventListener("change", (e) => {
  currentSymbol = e.target.value;
  calMonth = null;
  selectedDay = null;
  render();
});

$("refreshBtn").addEventListener("click", loadData);

document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const page = btn.dataset.page;
    $("homePage").style.display = page === "home" ? "" : "none";
    $("calendarPage").style.display = page === "calendar" ? "" : "none";
  });
});

$("calPrev").addEventListener("click", () => {
  calMonth.month--;
  if (calMonth.month < 0) { calMonth.month = 11; calMonth.year--; }
  selectedDay = null;
  renderCalendar();
});
$("calNext").addEventListener("click", () => {
  calMonth.month++;
  if (calMonth.month > 11) { calMonth.month = 0; calMonth.year++; }
  selectedDay = null;
  renderCalendar();
});

loadData();
setInterval(loadData, 5 * 60 * 1000); // 每5分钟自动刷新一次
</script>
</body>
</html>
